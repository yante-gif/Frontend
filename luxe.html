<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            display: flex;
            flex-direction: column;
            height: 90px;

            position: sticky;
            z-index: 1000;
        }
        .head-top {
            background-color: black;
            display: flex;
            height: 55px;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 10px;
            box-shadow: 1px 1px 5px black;
            font-family: 'Courier New', Courier, monospace;
        }
        .head-bot {
            display: flex;
            padding: 20px;
            background-color: white;
            box-shadow: 1px 1px 5px black;
        }
        .head-bo {
            display: flex;
        }
        .line {
            background-color: saddlebrown;
            height: 6px;
            width: 6px;
            border-radius: 50%;
            margin-top: 24px;
            margin-left: 5px;
        }
        .links {
            display: flex;
            margin: auto;
            gap: 30px;
            margin-left: 34%;
        }
        .links a {
            text-decoration: none;
            color: black;
        }
        .shapes {
            display: flex;
            gap: 20px;
            margin-left: 100%;
        }
        .shapes h3 {
            margin-top: 8px;
        }
        .hero {
            background: linear-gradient(90deg, rgba(0, 0, 0, .78), rgba(0, 0, 0, .12)),
            url(https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1800) center/cover no-repeat;
            min-height: 600px;
            
        }
        .hero1 {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        


        
    </style>
</head>
<body>
    <header>
    <div class="head-top">
        FREE SHIPPING ON ORDERS ABOVE ₦100,000
     </div>
     <div class="head-bot">
        <div class="head-bo">
            <h1>LUXE</h1>
            <div class="line"></div>
        </div>
        <div class="links">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Categories</a>
            <a href="#">About</a>
            <div class="shapes">
                <h3>🔎</h3>
                <h1>♟</h1>
                <h1>♣️</h1>
            </div>
        </div>
     </div>
    </header>
    <div class="hero">
        <div class="hero1">
            <p class="tag">NEW COLLECTION 2026</p>
        </div>
    </div>
</body>
</html>
