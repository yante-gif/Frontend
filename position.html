<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: blue;
            border-radius: 10px;
            width: 100px;
            height: 100px;
            margin: 5px;
        }
        .static {
            position: static;
        }
        .relative {
            position: relative;
            top: 20px;
            left: 20px;
        }
        .absolute {
            position: absolute;
            top: 40px;
            left: 40px;
        }
        .fixed {
            position: fixed;
            bottom: 0;
            right: 0;
        }

    </style>
</head>
<body>
    <!-- positioning -->
    <div class="box static"></div>
    <div class="box relative"></div>
    <div class="box absolute"></div>
    <div class="box fixed"></div>
</body>
</html>
