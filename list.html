<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Lists in html</h2>
    <h2>Unordered List</h2>
    <p>ul tag is used to define unordered lists</p>
    <ul>
        <li>Rice</li>
        <li>Beans</li>
        <li>Plantain</li>
    </ul>
    <p>ol tag is used to define ordered lists</p>
    <ol type="A">
        <li>Suya</li>
        <li>Shawarma</li>
        <li>Hotdog</li>
    </ol>
    <button style="border-radius: 8px;" type="button" onclick="alert('Welcome to html')">Submit</button><br><br>
    <button style="background-color: blue; color: white; border-radius: 8px;">Submit</button>
    <input type="submit" style="background-color: blue; color: white;" >
</body>
</html>
