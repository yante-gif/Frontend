<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        aside {
            
            border-radius: 10px;
            background-color: lightgray;
            width: 15%;
        }
        a {
            padding: 15px;
            display: block;
            color: black;
            text-decoration: none;
        }
        a:hover {
            background-color: black;
            color: white;
            font-weight: 600;
            border-radius: 5px;
        }
        
    </style>
</head>
<body>
    <h2>Vertical Sidebar Menu</h2>
    <p>The current page is highlighted with a blue background. Hover over other links to see the effect.</p>
    <aside>
        <a href="#dashboard">Dashboard</a>
        <a href="#services">Services</a>
        <a href="#projects">Projects</a>
        <a href="#team">Team</a>
        <a href="#contact">Contact</a>
    </aside>
</body>
</html>
