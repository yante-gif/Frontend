<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;

        }
        
        .box {
            background-color: lightgrey;
            width: 60px;
            height: 30px;
            animation-name: rot;
            animation-duration: 6s;
            animation-iteration-count: infinite;
            border-radius: 5px;
        
        }
        @keyframes rot {
            0%{background-color: saddlebrown;}
            25%{background-color: rgb(38, 23, 12); transform: rotate(180deg);}
            50%{background-color: rgb(153, 104, 39);}
            75%{background-color: rgb(49, 39, 24); transform: rotate(-180deg);}
            100%{background-color: black;}
        }
        header {
            background-color: black;
            width: 100%;
            height: 70px;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;

        }
        h1 {
            margin-left: 20px;
            
        }
        a {
            display: flex;
            justify-content: end;
            color: white;
            text-decoration: none;
        }
        a:hover {
            color: blue;
        }
        .h {
            display: flex;
            justify-content: end;
            margin-right: 30px;
            gap: 30px;
        }
        input {
            margin-left: 20%;
            width: 600px;
            height: 40px;
            border-style: hidden;
            border-radius: 10px;
            animation-name: search;
            animation-duration: 6s;
            animation-iteration-count: infinite;
            border-radius: 5px;
            color: white;
            caret-color: transparent;
        }
        @keyframes search {
            0%{background-color: black;}
            25%{background-color: rgb(38, 23, 12);}
            100%{background-color: black;}
        }
        input:hover {
            background-color: black;
            color: white;
            border-radius: 10px;
            border:2px inset ;
        }
        
        
    </style>
</head>
<body>
    <div>
        <header>
            <div class="box"></div>
            <h1>Yante</h1>
            <form action="submit.js">
                <input type="search" placeholder="Search Yante">
            </form>
            <header class="h">
            
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact">Contact</a>
        </header>
        </header>
    </div>

</body>
</html>
