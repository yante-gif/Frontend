<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            width: 80%;
            height: 700px;
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            gap: 10px;
            margin: auto;
            justify-content: center;
            border-style: hidden;
            
            
        }
        img {
            width: 130px;
            height: 130px;
            border-radius: 60px;
            margin-top: 5px;
        }
        
        .box {
            width: 350px;
            height: 300px;
            border: 1px solid black;
            border-style: hidden;
            background-color: whitesmoke;
            border-radius: 20px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);          
        }
        .box:hover {
            transform: translateY(-5px);
            box-shadow: 8px 15px 20px rgba(0, 0, 0, 0.8);
            
        }
        button {
            color: white;
            background-color: green;
            height: 30px;
            width: 100px;
            border: 1px solid;
            border-radius: 5px;
            
        }
        button:hover {
            transform: scale(0.9);
            cursor: pointer;
        }
        
    </style>

</head>
<body>
    <div class="container">
        <div class="box">
            <img src="1.jpeg" alt="first profile">
            <h1>John Doe</h1>
            <p>Frontend Developer</p>
            <button>View Profile</button>
        </div><br>
        <div class="box">
            <img src="2.jpeg" alt="second profile">
            <h1>Jaden Smith</h1>
            <p>UI/UX Designer</p>
            <button>View Profile</button>
        </div>
        <div class="box">
            <img src="3.jpeg" alt="third profile">
            <h1>Michael Lee</h1>
            <p>Backend Developer</p>
            <button>View Profile</button>
        </div>
        <div class="box">
            <img src="4.jpeg" alt="fourth profile">
            <h1>David Wilson</h1>
            <p>Project Manager</p>
            <button>View Profile</button>
        </div>
        <div class="box">
            <img src="5.jpeg" alt="fifth profile">
            <h1>Emily Davis</h1>
            <p>QA Engineer</p>
            <button>View Profile</button>
        </div>
        <div class="box">
            <img src="6.jpeg" alt="sixth profile">
            <h1>Ademola Lookman</h1>
            <p>DevOps Engineer</p>
            <button>View Profile</button>
        </div>
    </div>
</body>
</html>
