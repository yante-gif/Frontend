 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(55, 11, 11);
        }
        div {
            
            border: 1px ;
            color: white;
            border: 1px solid white;
            border-radius: 10px;
            margin: 20px;
            padding: 10px;
            background-color:black;
            border-style: hidden;
        }
        h1 {
            animation: slide 3s ease-in-out infinite alternate;
        }
        @keyframes slide {
            from {transform: translate(-100px); }
            to {transform: translate(100px);}
        }
        p {
            text-align: center;
        }
        input {
            height: 30px;
            width: 500px;
            background-color: rgb(46, 14, 14);
            border-style: hidden;
         
        }
        textarea {
            background-color: rgb(46, 14, 14);
            border-style: hidden;
            
        }
    </style>
</head>
<body>
    <div>
        <h1 style="text-align: center;">Contact Us</h1>
        <p>We're here to help! Reach out anytime.</p>
        <p><span style="color: blue; font-weight: bolder;">Email:</span>support@loanapp.com</p>
        <form action="submit.js">
            <input type="name" placeholder="Your Name"><br><br>
            <input type="email" placeholder="Your Email"><br><br>
            <textarea name="message" placeholder="Your Message" rows="4" cols="65"></textarea>

        </form>
        
    </div>
</body>
</html>
