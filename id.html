<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* the * is called universal selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #box {
            background-color: blue;
            color: white;
            width: 200px;
            height: 200px;
            border-radius: 20px;
            margin: 60px auto;
        }
        #box h2 {
            color: white;
        }
    </style>
</head>
<body>
    <div id="box">
        <h2>Welcome to Aptech</h2>   
    </div>
</html>
