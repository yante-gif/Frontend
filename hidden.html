<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bot {
            display: none;
        }
        .box {
            border: 2px solid white;
            background-color: green;
            width: 30%;
            height: 100px;
            border-radius: 10px;
            margin: 50px 60px 70px 80px;
            color: white;
            
            text-indent: 10px;
            
        }
        .car {
            border: 2px solid white;
            background-color: blue;
            width: 30%;
            height: 100px;
            border-radius: 10px;
            color: white;
            text-indent: 10px;
            padding: 50px 60px 70px 80px;
        }
    </style>
</head>
<body>
    <h2 class="bot">Idea Konsult Limited</h2>
    <p>Software Engineering</p>
    <div class="box">Web Development</div>
    <div class="car">Backend Engineering</div>
    
</body>
</html>
