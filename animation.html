<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: blue;
            border-radius: 10px;
            width: 100px;
            height: 100px;
            animation-name: example;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            position: relative;
        }
        @keyframes example {
            0% {background-color: blue; left: 0; top: 0;}
            25% {background-color: red; left: 200px; top: 0;}
            50% {background-color: green; left: 200px; top: 200px;}
            75% {background-color: black; left: 0; top: 200px;}
            100% {background-color: saddlebrown; left: 0; top: 0;}
        }
    </style>
</head>
<body>
    <h2>Animation in html</h2>
    <div class="box"></div>
</body>
</html>
