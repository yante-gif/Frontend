<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        aside {
            background-color: lightgray;
            width: 15%;
            border-radius: 10px; 
        }
        
        a {
            display: block;
            color: black;
            text-decoration: none;
            padding: 15px;
        }
        a:hover {
            display: block;
            background-color: black;
            color: white;
            border-radius: 5px;
            
        }
        h1 {
            font-weight: bolder;
        }
        p {
            font-weight: 500;
        }
       
       
    </style>
</head>
<body>
    <h1>Vertical Sidebar Menu</h1>
    <p>The current page is highlighted with a blue background. Hover over other links to see the effect</p>
    <aside>
        <a href="#dashboard" class="box">Dashboard</a>
        <a href="#services">Services</a>
        <a href="#projects">Projects</a>
        <a href="#team">Team</a>
        <a href="#contact">Contact</a>
    </aside>
</body>
</html>
