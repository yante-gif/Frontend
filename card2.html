<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            border: 1px solid black;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 400px;
            height: 330px;
            align-items: center;
        }
        img {
            width: 130px;
            height: 130px;  
            border-radius: 50%;
        }
        button {
            width: 100px;
            height: 40px;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            background-color: rgb(66, 27, 27);
            color: white;
        }
        button:hover {
            background-color: green;
            color: white;
            transform: scale(0.85);

        }
    </style>
</head>
<body>
    <div class="card">
        <img src="iPhone.jpeg" alt="iphone profile">
        <h1>Professor Yante</h1>
        <br>
        <p>Web developer that loves html and CSS</p>
        <button>Submit</button>

    </div>
</body>
</html>
