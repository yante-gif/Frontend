<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 1px solid black;
            width: 100%;
            padding: 5px;
        }
        header {
            background-color: aqua;
            text-align: center;
            padding: 10px;
            margin-bottom: 10px;
        }
        main {
            border: 1px solid black;
            width: 99.6%;
            margin: auto;
            padding: 3px;
            height: 300px;
        }
        button {
            border: 1px solid lightgray;
            height: 30px;
            cursor: pointer;

        }
        button:hover {
            background-color: green;
            color: white;
            transform: scale(0.9);
        }
        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: grey;
            width: 98.8%;
            margin-bottom: 0px;
            
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to my Page</h1>
            <p>This is a simple example with divs and CSS</p>
        </header>
        <main>
            <h2>About</h2>
            <p>This section is inside the content div. You can add text, images, or anything here.</p>
            <button>Click Me</button>
        </main>
        <br>
        <header class="box">
            <p>&copy; 2026 My Simple Website</p>

        </header>
    </div>
</body>
</html>
