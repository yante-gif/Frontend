<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            width: 500px;
            flex-direction: column;
            border-radius: 15px;
            background-color: saddlebrown;
            gap: 20px;
            justify-content: space-around;
            height: 350px;
            flex-wrap: wrap-reverse;
            
        }
        div {
            display: flex;
            background-color: burlywood;
            color: white;
            width: 100px;
            height: 80px;
            border-radius: 10px;
            padding: 10px;
            justify-content: center;
            align-items: center;
            
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div>Apple</div>
        <div>Banana</div>
        <div>Mango</div>
        <div>Orange</div>
        <div>Pear</div>
        <div>Lemon</div>
        <div>Cucumber</div>
    </div>
</body>
</html>
