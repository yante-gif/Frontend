<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            
        }
        header {
            background-color: saddlebrown;
            width: 100%;
            height: 60px;
            margin: 0;
            padding: 30px;

        }
        a {
            color: white;
            text-decoration: none;
            margin-right: 2%;
        }
        a:hover {
            color: blue;
        }
        table {
            border: 1px solid darkgrey;
            border-collapse: collapse;
            width: 600px;
            height: 200px;
            margin: 10px;

        }
        th, td {
            border: 1px solid darkgray;
        }
        .box {
            display: flex;
            background-color: saddlebrown;
            width: 600px;
            height: 300px;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin: 10px;
        }        
        div {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: burlywood;
            width: 100px;
            height: 60px;
            color: white;
            border-radius: 10px;
        }
        h1 {
            
            color: white;
            display: inline;
            margin-right: 300px;
            
        }
        .rotate {
            width: 20px;
            height: 20px;
            border-radius: 10%;
            display: inline-block;
            animation-name: rot;
            animation-duration: 6s;
            animation-iteration-count: infinite;
            animation-direction: normal;
            background-color: black;
            

        }
        @keyframes rot {
            0%{background-color: burlywood; transform: rotate(180deg);}
            25%{background-color: saddlebrown;}
            50%{background-color: darkgreen; transform: rotate(-180deg);}
            75%{background-color: dimgray;}
            100%{background-color: saddlebrown; transform: rotate(180deg);}
        }
        
    </style>
</head>
<body>
    <header>
        <div class="rotate"></div>
        <h1>Yante</h1>
        <form action="submit.js">
            <input type="search" placeholder="Search Yante">
        </form>
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#contact">Contact</a>
    </header>
    <br>
    <table>

            <th>#</th>

            <th>Level</th>

        </tr>
        <tr>
            <td>2</td>
            <td>102</td>
            <td>Israel</td>
            <td>22/5969</td>
            <td>300</td>
        </tr>
        <tr>
            <td>3</td>
            <td>103</td>
            <td>Nifemi</td>
            <td>22/2091</td>
            <td>500</td>
        </tr>
        <tr>
            <td>4</td>

        </tr>
        <tr>

        </tr>


        </tr>
    </table>
    <br>
    <div class="box">
        <div>Mango</div>

        <div>Pear</div>
    </div>
</body>
</html>
