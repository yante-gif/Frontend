<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(atom1.jpeg);
            background-size: cover;
            height: 100vh;
        }
        
        h2 {
            margin-bottom: 5px;
            color: white;
            
        }
        input {
            width: 370px;
            height: 30px;
            border-radius: 5px;
            

        }
        input:hover {
            color: white;
            background-color: rgb(99, 50, 15);
            border: 3px inset lightgrey;
        }
        h1 {
            margin-bottom: 5px;
        }
        p {
            margin-top: 5px;
        }
        h1, p {
            margin-top: 10px;
            color: white;
            
        }
        .forms {
            background-image: url(atom1.jpeg);
            background-size: contain;
            background-repeat: no-repeat;
            padding: 10px;
            width: 25%;
            border-radius: 20px;
            box-shadow: 10px 10px 15px black;
            
        }
        button{
            width: 100px;
            height: 30px;
            
            box-shadow: 5px 5px 10px black;
            border-radius: 10px;
            margin: 20px;
            margin-left: 2px;
        }
        button:hover{
            transform: scale(0.9);
            background-color: saddlebrown;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <div class="forms">
        <form action="submit.js">
            <h1>Create Account</h1>
            <p>Welcome to the best space to care for your foot!</p>
            <h2>Full Name</h2>
            <input type="name" placeholder="Enter full name">
            <h2>Email</h2>
            <input type="email" placeholder="Enter email">
            <h2>Date of Birth</h2>
            <input type="date">
            <h2>Username</h2>
            <input type="username" placeholder="Enter username">
            <h2>Password</h2>
            <input type="password" placeholder="Enter password" class="pass">
            <span id="toggle" class="eye">👁</span>
        </form>
        <br><br>
        <button>Sign Up</button>
    </div>
        

    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("toggle");

        toggle.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        });
    </script>
</body>
</html>
